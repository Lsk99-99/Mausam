server:
  port: 8080

mausam:
  python-service:
     base-url: https://mausam-python-service.onrender.com
  jwt:
    # Dev-only secret — replace with a real secret (env var) before deploying anywhere real.
    secret: ${MAUSAM_JWT_SECRET}
    expiry-hours: 24

spring:
  application:
    name: mausam-api
  datasource:
    # File-based (not in-memory) — user accounts now persist across
    # restarts, saved to ./mausamdb.mv.db in whichever folder you run
    # the server from.
    url: jdbc:h2:file:./mausamdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
